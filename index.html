<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="src/style/master.css">
    <link rel="stylesheet" href="src/style/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/assets/bootstrap-icons/font/bootstrap-icons.css">
</head>

<body class="w-full h-dvh flex justify-center items-center myBg bg-gray-800 p-2.5 md:p-5 gap-5">
    <!-- ------------------------moblile menu-------------------------- -->
    <nav
        class="w-11/12 h-fit rounded-full flex items-center justify-center bg-gray-900 border-t border-t-red-900 md:hidden absolute bottom-5 left-[50%] translate-x-[-50%] z-50">
        <ul
            class="w-full h-fit flex justify-evenly items-center p-1.5 *:w-fit *:h-fit *:rounded-full *:text-red-200 *:cursor-pointer *:hover:bg-[#60212168] *:duration-300 *:p-1.5">
            <li><i class="bi bi-house"></i></li>
            <li><i class="bi bi-ui-radios-grid"></i></li>
            <li><i class="bi bi-person-check"></i></li>
            <li><i class="bi bi-music-note-list"></i></li>
            <li><i class="bi bi-person-circle"></i></li>
        </ul>
    </nav>
    <!-- ------------------------large screen menu-------------------------- -->
    <nav
        class="lgScreen hidden md:w-1/4 lg:w-1/6 h-full rounded-[10px] md:flex flex-wrap justify-center Bg1 border border-[#91303029]">
        <logo class="w-full h-fit text-center text-red-300 fontfamily mt-10 md:text-2xl lg:text-4xl cursor-pointer">
            RollDot.</logo>
        <ul
            class="w-full h-fit flex-col justify-center items-center p-2.5 *:w-full *:h-fit *:py-2.5 *:text-red-200 *:cursor-pointer *:hover:bg-[#6021213c] *:duration-300 *:p-2.5">
            <li class="border-b border-b-[#944f4f44] flex items-center gap-x-3"><i class="bi bi-house"></i>Home</li>
            <li class="accMenu border-b border-b-[#944f4f44] flex flex-wrap items-center gap-x-3 relative">
                <i class="bi bi-ui-radios-grid cursor-pointer"></i>Categories
                <i class="down bi bi-chevron-down text-red-200 absolute right-2.5 top-[50%] translate-y-[-50%]"></i>

                <ul
                    class="w-full h-fit *:hover:pl-1.5 *:duration-300 flex flex-wrap justify-center items-center mt-1.5">
                    <li class="w-full h-fit flex items-center gap-3 py-1 text-[#ffc9c970]">
                        <i>-</i>Metalcore
                    </li>
                    <li class="w-full h-fit flex items-center gap-3 py-1 text-[#ffc9c970]">
                        <i>-</i>Alternative Rock
                    </li>
                    <li class="w-full h-fit flex items-center gap-3 py-1 text-[#ffc9c970]">
                        <i>-</i>Alternative
                    </li>
                </ul>
            </li>

            <li class="border-b border-b-[#944f4f44] flex items-center gap-x-3"><i
                    class="bi bi-person-check"></i>Artists
            </li>

            <li class="accMenu flex flex-wrap items-center gap-x-3 relative"><i
                    class="bi bi-music-note-list"></i>Playlists
                <i class="down bi bi-chevron-down text-red-200 absolute right-2.5 top-[50%] translate-y-[-50%]"></i>
                <ul
                    class="w-full h-fit *:hover:pl-1.5 *:duration-300 flex flex-wrap justify-center items-center mt-1.5">
                    <li class="w-full h-fit flex items-center gap-x-3 py-1 text-[#ffc9c970]"> <i
                            class="bi bi-folder2"></i>My Top 10</li>
                    <li class="w-full h-fit flex items-center gap-x-3 py-1 text-[#ffc9c970]"> <i
                            class="bi bi-folder2"></i>Others</li>

                </ul>
            </li>
        </ul>
    </nav>
    <!-- ------------------------main-------------------------- -->
    <div class=" w-full md:w-4/5 lg:w-5/6 h-full rounded-[15px] flex flex-wrap justify-center overflow-y-scroll">
        <section class="w-full h-fit px-5 flex justify-between items-center">
            <logo class="w-fit h-fit md:hidden text-center text-red-300 fontfamily text-2xl cursor-pointer">RollDot.
            </logo>

            <div class=" w-1/2 md:w-1/3 lg:w-1/4 h-fit flex flex-wrap justify-center items-center relative">
                <input id="search"
                    class="w-full h-full Bg1 border border-[#91303029] px-2.5 py-1 rounded-full text-gray-400"
                    type="text">
                <span id="searchBtn"
                    class="bi bi-search absolute right-[10px] top-[50%] translate-y-[-50%] text-red-200 cursor-pointer z-50"></span>
                <div id="searchSection"
                    class="hidden w-full h-fit absolute top-[110%] left-0 overflow-y-scroll p-1 *:p-2 *:border-b *:border-b-[#944f4f44] *:text-white *:text-[12px] *:flex *:gap-x-5 *:items-center *:justify-between *:cursor-pointer bg-[rgb(95,38,38)] rounded-[5px] *:hover:bg-[#6021213c] *:duration-300 z-50">
                </div>
            </div>
            <div class="hidden md:w-1/3 lg:w-1/4 h-fit md:flex justify-end items-center relative gap-3">
                <p class="text-red-200 text-[14px]">Reyhaneh</p>
                <figure class="size-[39px] rounded-full overflow-hidden">
                    <img class="object-cover w-full h-full" src="src/assets/img/reyhaneh.jpeg.jpg" alt="">
                </figure>
            </div>

        </section>

        <!-- ------------------------large screen slider-------------------------- -->
        <section class="w-full h-fit flex flex-wrap justify-center items-center mt-10 relative overflow-hidden">
            <figure
                class="size-[50%] md:size-[25%] border-2 border-[#913030b8] rounded-[10px]  *:overflow-hidden relative">
                <img src="src/assets/img/covers/crawl.jpg" class="object-center object-cover z-50 rounded-[10px]"
                    alt="">
            </figure>
            <figure
                class="size-[50%] md:size-[25%] border-2 border-[#913030b8] rounded-[10px] absolute scale-[.9] top-0 right-[40%] md:right-[55%] -z-40 opacity-70">
                <img src="src/assets/img/covers/creep.png" class="object-center object-cover rounded-[10px]" alt="">
            </figure>
            <figure
                class="size-[50%] md:size-[25%] border-2 border-[#913030b8] rounded-[10px] absolute scale-[.8] top-0 right-[70%] -z-50 opacity-20">
                <img src="src/assets/img/covers/hysteria.jpg" class="object-center object-cover rounded-[10px]" alt="">
            </figure>
            <figure
                class="size-[50%] md:size-[25%] border-2 border-[#913030b8] rounded-[10px] absolute scale-[.9] top-0 left-[40%] md:left-[55%] -z-40 opacity-70">
                <img src="src/assets/img/covers/2face-emptiness-heavy.jpg"
                    class="object-center object-cover rounded-[10px]" alt="">
            </figure>
            <figure
                class="size-[50%] md:size-[25%] border-2 border-[#913030b8] rounded-[10px] absolute scale-[.8] top-0 left-[70%] -z-50 opacity-20">
                <img src="src/assets/img/covers/softcore.webp" class="object-center object-cover rounded-[10px]" alt="">
            </figure>
        </section>
        <!-- -------------------------------------------------------------- -->
        <section class="w-full h-fit px-5  mt-10 flex flex-wrap items-start justify-between gap-5">
            <div class="w-full h-fit flex flex-wrap gap-2.5 items-center">
                <h2 class="w-full text-xl text-red-200 font-bold">Select Categories</h2>
                <a href=""
                    class="text-[14px] flex justify-center items-center py-1 px-5 border border-red-200 text-black bg-red-200 rounded-full">All</a>
                <a href=""
                    class="text-[14px] flex justify-center items-center py-1 px-5 border border-red-200 text-red-200 rounded-full hover:text-black hover:bg-red-200 duration-300">Metalcore</a>
                <a href=""
                    class="text-[14px] flex justify-center items-center py-1 px-5 border border-red-200 text-red-200 rounded-full hover:text-black hover:bg-red-200 duration-300">Alternative
                    Rock</a>
                <a href=""
                    class="text-[14px] flex justify-center items-center py-1 px-5 border border-red-200 text-red-200 rounded-full hover:text-black hover:bg-red-200 duration-300">Alternative</a>
            </div>

            <div class="w-full lg:w-[60%] h-[100vh] flex flex-wrap gap-y-5 pb-5">
                <div class="w-full rounded-[10px] p-5 Bg1 border border-[#91303029] h-[40%]">
                    <h2 class="w-full text-xl text-red-200 font-bold">Top Bands</h2>

                    <div class="h-fit pt-5 pb-16 flex gap-x-5 overflow-x-auto flex-nowrap overflow-y-hidden">
                        <figure
                            class="w-[100px] h-[100px] border-2 border-[#91303029] rounded-[10px] relative cursor-pointer hover:scale-[1.1] flex-shrink-0 duration-200">
                            <img src="src/assets/img/covers/Bad_Omens_band.jpg"
                                class="w-full h-full rounded-[10px] object-cover" alt="">
                            <h3
                                class="w-full h-fit text-center text-red-200 absolute top-[100%] left-0 text-[14px] pt-2">
                                Bad Omens</h3>
                        </figure>
                        <figure
                            class="w-[100px] h-[100px] border-2 border-[#91303029] rounded-[10px] relative cursor-pointer hover:scale-[1.1] flex-shrink-0 duration-200">
                            <img src="src/assets/img/covers/linkin-park-band-logo-design.png"
                                class="w-full h-full rounded-[10px]" alt="">
                            <h3
                                class="w-full h-fit text-center text-red-200 absolute top-[100%] left-0 text-[14px] pt-2">
                                Linkin Park</h3>
                        </figure>
                        <figure
                            class="w-[100px] h-[100px] border-2 border-[#91303029] rounded-[10px] relative cursor-pointer hover:scale-[1.1] flex-shrink-0 duration-200">
                            <img src="src/assets/img/covers/muse-band.jpg" class="w-full h-full rounded-[10px]" alt="">
                            <h3
                                class="w-full h-fit text-center text-red-200 absolute top-[100%] left-0 text-[14px] pt-2">
                                Muse</h3>
                        </figure>
                        <figure
                            class="w-[100px] h-[100px] border-2 border-[#91303029] rounded-[10px] relative cursor-pointer hover:scale-[1.1] flex-shrink-0 duration-200">
                            <img src="src/assets/img/covers/softcore.webp" class="w-full h-full rounded-[10px]" alt="">
                            <h3
                                class="w-full h-fit text-center text-red-200 absolute top-[100%] left-0 text-[14px] pt-2">
                                The Neighborhood</h3>
                        </figure>
                        <figure
                            class="w-[100px] h-[100px] border-2 border-[#91303029] rounded-[10px] relative cursor-pointer hover:scale-[1.1] flex-shrink-0 duration-200">
                            <img src="src/assets/img/covers/radiohead-logo.png" class="w-full h-full rounded-[10px]"
                                alt="">
                            <h3
                                class="w-full h-fit text-center text-red-200 absolute top-[100%] left-0 text-[14px] pt-2">
                                Radiohead</h3>
                        </figure>
                        <figure
                            class="w-[100px] h-[100px] border-2 border-[#91303029] rounded-[10px] relative cursor-pointer hover:scale-[1.1] flex-shrink-0 duration-200">
                            <img src="src/assets/img/covers/gasoline.jpg" class="w-full h-full rounded-[10px]" alt="">
                            <h3
                                class="w-full h-fit text-center text-red-200 absolute top-[100%] left-0 text-[14px] pt-2">
                                Alone In My Room</h3>
                        </figure>
                    </div>
                </div>

                <!---------------- most played section ---------------->
                <div
                    class="w-full rounded-[10px] p-5 pb-16 Bg1 border border-[#91303029] h-[60%] lg:h-[70%] flex flex-wrap gap-x-5 gap-y-10 items-center lg:justify-between md:gap-y-5 overflow-hidden">
                    <h2 class="w-full text-xl text-red-200 font-bold">Most Played</h2>
                    <ul id="mostPlayed"
                        class="w-full h-full overflow-y-scroll p-1 *:p-2 *:border-b *:border-b-[#944f4f44] *:text-red-200 *:flex *:gap-x-5 *:items-center *:cursor-pointer *:relative *:hover:bg-[#6021213c] *:duration-300">
                    </ul>
                </div>
            </div>

            <!-- ------------------ Player Section ------------------ -->
            <div id="player"
                class="w-full lg:w-[38%] rounded-[10px] p-5 pb-16 Bg1 border border-[#91303029] h-fit flex flex-wrap gap-x-5 gap-y-10 items-center lg:justify-between md:gap-y-5">
                <figure class="w-full h-fit overflow-hidden rounded-[10px] shadow-2xl shadow-[#9130306e]">
                    <img src="src/assets/img/default-avatar-icon-of-social-media-user-vector.jpg" alt="" id="cover"
                        class="w-full h-full object-cover">
                </figure>
                <figcaption class="w-full p-2.5 flex flex-col justify-center">
                    <h3 id="title" class="text-center text-red-200 font-extrabold text-[20px]">Song Name</h3>
                    <h6 id="artist" class="text-center text-red-200">Artist Name</h6>
                </figcaption>

                <section class="w-full p-2.5 flex gap-2.5 justify-between items-center">
                    <span id="current" class="text-red-200 text-xs">0:00</span>
                    <div class="w-[70%] h-[5px] rounded-full bg-gray-500 relative cursor-pointer">
                        <div id="progress"
                            class="absolute w-[0%] h-full rounded-full left-0 top-[50%] translate-y-[-50%] prbarBg">
                            <span id="dot"
                                class="absolute right-0 top-[50%] translate-y-[-50%] size-[15px] rounded-full bg-red-200"></span>
                        </div>
                    </div>
                    <span id="duration" class="text-red-200 text-xs">0:00</span>
                </section>

                <section class="w-full h-fit p-2.5 flex justify-evenly items-center">
                    <i id="prev" class="bi bi-skip-start-fill text-red-200 text-3xl cursor-pointer"></i>
                    <i id="play" class="bi bi-play-fill text-red-200 text-3xl cursor-pointer"></i>
                    <i id="next" class="bi bi-skip-end-fill text-red-200 text-3xl cursor-pointer"></i>
                </section>

                <section class="w-full h-fit flex justify-between items-center px-2.5">
                    <div class="w-fit h-fit flex justify-between items-center gap-x-2.5">
                        <i id="volBtn" class="bi bi-volume-up text-red-200 text-2xl cursor-pointer"></i>
                        <div id="vol" class="w-[70px] h-[3px] rounded-full bg-gray-500 relative cursor-pointer">
                            <div
                                class="absolute w-[50%] h-full rounded-full left-0 top-[50%] translate-y-[-50%] bg-red-200">
                                <span
                                    class="absolute right-0 top-[50%] translate-y-[-50%] size-[9px] rounded-full bg-red-200"></span>
                            </div>
                        </div>
                    </div>
                    <i id="repeatBtn" class="bi bi-repeat text-red-200 cursor-pointer"></i>
                </section>

                <audio id="audio"></audio>

            </div>
    </div>

</body>
<script src="src/js/master.js"></script>

</html>
